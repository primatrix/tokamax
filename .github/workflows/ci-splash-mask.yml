name: Splash mask host preprocessing

on:
  pull_request:
    branches: [main, release/v0.2]
    paths:
      - 'tokamax/_src/ops/experimental/tpu/splash_attention/**'
      - '.github/workflows/ci-splash-mask.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splash-mask-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  host-mask-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install -e . 'jax[cpu]==0.11.0' pytest
      - name: Check mask metadata and cold 1M causal preprocessing
        run: >-
          python -m pytest -q
          tokamax/_src/ops/experimental/tpu/splash_attention/splash_attention_mask_test.py
          -k SplashAttentionMaskInfoTest
